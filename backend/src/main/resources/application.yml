spring:
  output:
    ansi:
      enabled: always
  application:
    name: leaf-boss-backend
  profiles:
    active: dev
  mail:
    from-name: LEAF-BOSS
  jackson:
    default-property-inclusion: non_null
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
  cache:
    type: none

server:
  port: 8081

app:
  jwt:
    secret: bGVhZi1ib3NzLXNlY3JldC1rZXktZm9yLWp3dC10b2tlbi1nZW5lcmF0aW9uLXBsZWFzZS1jaGFuZ2U=
    expiration: 604800000      # token 有效期 7 天（滑动窗口）
    renew-threshold: 259200000  # 签发超过 3 天则续期
    max-age: 2592000000        # 绝对上限 30 天，超过必须重新登录
  cors:
    allowed-origins: http://localhost:8080,chrome-extension://*
