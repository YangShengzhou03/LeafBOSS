spring:
  datasource:
    url: jdbc:mysql://leafboss-mysql:3306/leaf_boss?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      pool-name: LeafBossHikariPool
  mail:
    host: smtp.qq.com
    port: 465
    username: yangsz03@foxmail.com
    password: ${SMTP_PASSWORD:}
    protocol: smtp
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000

app:
  cors:
    allowed-origins: https://leafboss.top,chrome-extension://*

mybatis-plus:
  type-aliases-package: com.leafboss.entity
  configuration:
    map-underscore-to-camel-case: true
